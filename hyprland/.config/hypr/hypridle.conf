general {
    lock_cmd = pidof hyprlock || playerctl pause || hyprlock       # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display
}

listener {
    timeout = 150                                # 2.5 min.
    on-timeout = brightnessctl -s set 2%         # lower monitor backlight, avoid 0 on OLED monitor
    on-resume = brightnessctl -r                 # monitor backlight restore
}

listener {
    timeout = 300                                                   # 5min
    on-timeout = hyprctl dispatch dpms off && loginctl lock-session # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on                            # screen on when activity is detected after timeout has fired
}

listener {
    timeout = 600                                 # 10min
# suspend-then-hibernate oprion will suspend pc and after some time hibernate it
# The time after which PC will transition from suspend to hibernate is defined
# in /etc/systemd/sleep.conf file
    on-timeout = systemctl suspend-then-hibernate                # suspend pc
}
