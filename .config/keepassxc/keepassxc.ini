[General]
BackupBeforeSave=true
BackupFilePathPattern=/home/phill/Sync/Passwords_databases/{DB_FILENAME}.old.kdbx
ConfigVersion=2

[Browser]
CustomProxyLocation=
Enabled=true
SearchInAllDatabases=true

[GUI]
ApplicationTheme=dark
CompactMode=true
ToolButtonStyle=2
TrayIconAppearance=monochrome-light

[KeeShare]
Active="<?xml version=\"1.0\"?><KeeShare><Active/></KeeShare>\n"
Own="<?xml version=\"1.0\"?><KeeShare><PrivateKey></PrivateKey><PublicKey><Signer>phill</Signer><Key></Key></PublicKey></KeeShare>\n"
QuietSuccess=true

[PasswordGenerator]
AdditionalChars=
AdvancedMode=false
Braces=true
Dashes=true
ExcludedChars=
Length=17
Logograms=true
Math=true
Punctuation=true
Quotes=true
SpecialChars=true
WordCase=2
WordCount=40
WordSeparator=" |"
