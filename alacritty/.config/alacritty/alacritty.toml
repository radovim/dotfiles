import = ["/home/ary/.config/alacritty/one-dark.toml"]
live_config_reload = true
#theme = "Atom"

[cursor.style]
shape = "Beam"

[font]
size = 12

[font.bold]
family = "Iosevka Nerd Font"
style = "Bold"

[font.bold_italic]
family = "Iosevka Nerd Font"
style = "Bold Italic"

[font.italic]
family = "Iosevka Nerd Font"
style = "Italic"

[font.normal]
family = "Iosevka Nerd Font"
style = "Regular"

[scrolling]
history = 10000
multiplier = 3

[shell]
program = "/bin/zsh"

[window]
decorations = "full"
dynamic_padding = true
dynamic_title = true
opacity = 0.9

[window.dimensions]
columns = 120
lines = 30

[window.padding]
x = 3
y = 0
