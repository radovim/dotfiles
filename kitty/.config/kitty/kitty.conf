# vim:fileencoding=utf-8:foldmethod=marker
cursor_shape block
enable_audio_bell yes
confirm_os_window_close 0
background_opacity 1
background_blur 1
term xterm-256color
shell /usr/bin/zsh

# BEGIN_KITTY_FONTS
font_family      family="Iosevka Nerd Font"
font_size 15
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS


# BEGIN_KITTY_THEME
# Gruvbox Dark
include current-theme.conf
# END_KITTY_THEME
