# vim:fileencoding=utf-8:foldmethod=marker

# BEGIN_KITTY_THEME
# Dracula
include current-theme.conf
# END_KITTY_THEME

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 14

cursor_shape block

enable_audio_bell yes

confirm_os_window_close 0

background_opacity 1
background_blur 1

term xterm-256color
shell /usr/bin/zsh


